<!-- Создать класс с методами, вычисляющими значения выражения 
1) y=3x+5 
2) y=(a+b)/(a-b) 
3) y=(ax/b)! 
Создать три объекта класса -->
<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="utf-8">
</head>
<body>
    <script type="text/javascript">
        class Calc {
            calc1(a) { return 3 * a + 5; }
            calc2(a, b) { return (a + b) / (a - b); }
            calc3(a, b, c) {
                let result = (a * b) / c;
                for (let i = result; i > 1; i--) result *= (i - 1);
                return result;
            }
        }

        const calc = new Calc();
        console.log(calc.calc1(5));
        console.log(calc.calc2(5, 6));
        console.log(calc.calc3(5, 6, 7));
    </script>
</body>
</html>
